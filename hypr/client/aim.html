<!doctype html><meta charset="utf-8"><title>aim</title>
<style>html,body{margin:0;height:100%;background:#0c1014;overflow:hidden}
#t{position:fixed;width:22px;height:22px;border-radius:3px}</style>
<body><div id="t"></div>
<script>
// One small target at a time, at thirteen places: the four corners (as close to the
// window's corners as a real close button sits), the four edge midpoints, the centre,
// and four in between. ANY click moves it on, and the title says whether that click
// was on the target: "aim <count> <spot> <x> <y> <hit|miss|none>". Nothing moves it on
// by itself, so a hit can only ever be a click. Its colour alternates with the count,
// so a test can tell a fresh picture of it from a stale one.
const m = 6, t = document.getElementById('t');
const spots = [[0,0],[1,0],[0,1],[1,1],[.5,0],[.5,1],[0,.5],[1,.5],[.5,.5],[.25,.25],[.75,.25],[.25,.75],[.75,.75]];
let i = 0, last = 'none', cx = -1, cy = -1;
function place() {
  const [fx, fy] = spots[i % spots.length], W = innerWidth, H = innerHeight;
  const x = m + fx * (W - 22 - 2 * m), y = m + fy * (H - 22 - 2 * m);
  t.style.left = x + 'px'; t.style.top = y + 'px';
  t.style.background = i % 2 ? '#2bf0ff' : '#ff2bd6';
  document.title = ['aim', i, i % spots.length, Math.round(x + 11), Math.round(y + 11), last, cx, cy].join(' ');
}
// the page point the click arrived at, so a test can measure the error in pixels, not just hit or miss
addEventListener('mousedown', e => { last = e.target === t ? 'hit' : 'miss'; cx = Math.round(e.clientX); cy = Math.round(e.clientY); i++; setTimeout(place, 120); });
addEventListener('resize', place); place();
</script></body>
